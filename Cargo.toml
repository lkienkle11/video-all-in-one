[workspace]
members = ["crates/core", "crates/media", "crates/storage", "crates/platform", "apps/desktop", "xtask"]
resolver = "2"

[workspace.package]
version = "0.0.0"
edition = "2021"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde_json = "1"
gpui-kit = "=0.11.0"
proptest = "1"
serde = { version = "1", features = ["derive"] }
semver = { version = "1", features = ["serde"] }
sha2 = "0.11"
ed25519-dalek = "3"
base64 = "0.23"
