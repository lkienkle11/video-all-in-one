# Builds our own LGPL libmpv (with FFmpeg and the few libraries it needs) from pinned sources
# on every platform that ships one, and publishes each archive as an asset of the pre-release
# `libmpv-<recipe version>` (never a `v*` tag, so it is not an app release).
# CI and the release workflow download these archives; their SHA-256 is pinned in
# LIBMPV_SHA256_* at the top of ci.yml and release.yml (see docs/RELEASING.md, "Our own libmpv").
#
# It also runs on pushes to feat/** that change the recipe, because a workflow that only has
# workflow_dispatch cannot be started from a branch that is not the default branch yet.
name: Build libmpv

on:
  workflow_dispatch:
  push:
    branches:
      - "feat/**"
    # A recipe change always raises RECIPE_VERSION (the release asset is never overwritten), and
    # that constant lives in sources.rs, so only this file and the workflow start a build. Other
    # edits under xtask/src/libmpv (for example a test) do not rebuild three runners for nothing.
    paths:
      - "xtask/src/libmpv/sources.rs"
      - ".github/workflows/build-libmpv.yml"

permissions:
  contents: read

concurrency:
  group: build-libmpv-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  # Overrides rust-toolchain.toml (channel "stable") so every run uses the same compiler.
  RUSTUP_TOOLCHAIN: "1.99.1"
  # Must equal RECIPE_VERSION in xtask/src/libmpv/sources.rs (a test checks it).
  LIBMPV_RECIPE: "1"
  # Build tools installed from PyPI into a throw-away virtual environment.
  MESON_VERSION: "1.8.2"
  NINJA_VERSION: "1.11.1.4"
  JINJA2_VERSION: "3.1.6"
  MARKUPSAFE_VERSION: "3.0.2"

jobs:
  build:
    name: build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-22.04
            target: ubuntu
          - name: macos-arm64
            os: macos-15
            target: macos
          - name: macos-x86_64
            os: macos-15-intel
            target: macos
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --no-self-update

      # Restores the installed components of an earlier run (the output folder with one marker
      # file per component, plus the cargo and xtask build). A component whose marker matches
      # its recipe hash is not built again. The unpacked sources are not cached.
      - name: Restore the earlier build
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
            ${{ runner.temp }}/libmpv
          key: libmpv-${{ matrix.name }}-${{ github.sha }}
          restore-keys: |
            libmpv-${{ matrix.name }}-

      # Only build tools and the audio libraries of the platform; the codec libraries are built
      # from the pinned sources, never installed from the system.
      - name: Install the build tools (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config nasm patchelf python3-venv \
            libasound2-dev libpulse-dev

      - name: Install the build tools (macOS)
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: brew install nasm pkgconf

      - name: Install meson and ninja (pinned)
        run: |
          python3 -m venv "$RUNNER_TEMP/buildtools"
          "$RUNNER_TEMP/buildtools/bin/pip" install --disable-pip-version-check \
            "meson==$MESON_VERSION" "ninja==$NINJA_VERSION" \
            "jinja2==$JINJA2_VERSION" "markupsafe==$MARKUPSAFE_VERSION"
          echo "$RUNNER_TEMP/buildtools/bin" >> "$GITHUB_PATH"

      # The xtask command downloads each source archive, checks its pinned SHA-256 before
      # unpacking, builds with the LGPL options and runs the license scan and the API check.
      # It starts every build tool with a clean environment.
      - name: Build libmpv
        run: cargo xtask libmpv build --target "${{ matrix.target }}" --out "$RUNNER_TEMP/libmpv"

      # Saved even when the build failed, so that the next run starts after the last component
      # that was installed.
      - name: Save the build for the next run
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
            ${{ runner.temp }}/libmpv
          key: libmpv-${{ matrix.name }}-${{ github.sha }}

      - name: Pack libmpv
        id: pack
        run: |
          set -eu
          archive="libmpv-${LIBMPV_RECIPE}-${{ matrix.name }}.tar.gz"
          mkdir -p "$RUNNER_TEMP/archive"
          line=$(cargo xtask libmpv pack --dir "$RUNNER_TEMP/libmpv" --out "$RUNNER_TEMP/archive/$archive" | tail -n 1)
          hash=${line%% *}
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
          {
            echo "### $archive"
            echo
            echo "SHA-256: \`$hash\`"
            echo
            echo "Put it in \`LIBMPV_SHA256_*\` of ci.yml and release.yml."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "$archive $hash"

      - name: Keep the archive for the publish job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: libmpv-${{ matrix.name }}
          path: ${{ runner.temp }}/archive/${{ steps.pack.outputs.archive }}
          if-no-files-found: error
          retention-days: 7

  # The only job that can write to the repository. It adds the archives to the release
  # libmpv-<recipe>. An asset that already exists is never replaced: bump LIBMPV_RECIPE and
  # RECIPE_VERSION to publish a changed build.
  publish:
    name: publish the archives
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - name: Download the archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: libmpv-*
          merge-multiple: true
          path: archives

      - name: Create the release if it is missing, then add the archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          tag="libmpv-${LIBMPV_RECIPE}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "release $tag exists"
          else
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --prerelease --target "$GITHUB_SHA" \
              --title "libmpv build recipe ${LIBMPV_RECIPE}" \
              --notes "LGPL libmpv and FFmpeg libraries built by .github/workflows/build-libmpv.yml. Not an app release: the app downloads these in CI. Licences and source URLs are inside each archive (LICENSES/)."
          fi
          existing=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
          for file in archives/*.tar.gz; do
            name=$(basename "$file")
            if printf '%s\n' "$existing" | grep -qx "$name"; then
              echo "::error::$name is already published in $tag; assets are never overwritten"
              exit 1
            fi
          done
          gh release upload "$tag" archives/*.tar.gz --repo "$GITHUB_REPOSITORY"
          for file in archives/*.tar.gz; do
            echo "$(basename "$file") $(sha256sum "$file" | cut -d' ' -f1)" >> "$GITHUB_STEP_SUMMARY"
          done
